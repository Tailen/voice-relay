[project]
name = "voicerelay"
version = "0.1.0"
description = "Local macOS application-audio voice conversion with X-VC"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "numpy==1.26.4",
  "scipy==1.13.1",
  "librosa==0.10.2",
  "soundfile==0.14.0",
  "soxr==1.1.0",
  "mlx==0.32.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "transformers==4.46.3",
  "x-transformers==1.40.2",
  "einx==0.3.0",
  "hydra-core==1.3.7",
  "omegaconf==2.3.1",
  "descript-audiotools==0.7.2",
  "wandb==0.18.5",
  "tensorboard==2.20.0",
]

[dependency-groups]
dev = ["ruff==0.14.0"]

[tool.uv]
package = false
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["voicerelay/**/*.py", "scripts/**/*.py", "tests/**/*.py", "native/app/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
